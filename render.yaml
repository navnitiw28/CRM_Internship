services:
  - type: web
    name: intern-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --workspace backend && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: intern-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://intern-frontend.onrender.com

  - type: web
    name: intern-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: npm install --workspace frontend && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://intern-backend.onrender.com

databases:
  - name: intern-postgres
    plan: free
    databaseName: intern
    user: intern_user
