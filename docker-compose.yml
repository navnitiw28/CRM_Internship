version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intern
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    ports:
      - '5000:5000'
      - '5173:5173'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/intern
      JWT_SECRET: dev-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
      FRONTEND_URL: http://localhost:5173

volumes:
  postgres-data:
